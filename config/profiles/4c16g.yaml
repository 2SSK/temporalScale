cores: 4
memoryGB: 16
maxShardsPerHost: 4096
goMaxProcs: 4
goMemLimit: 8600MiB
memoryHigh: 13000M
memoryMax: 14000M
dbMaxConns: 50
dbVisibilityMaxConns: 10

dynamicConfig:
