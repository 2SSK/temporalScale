cores: 2
memoryGB: 4
maxShardsPerHost: 1024
goMaxProcs: 2
goMemLimit: 1800MiB
memoryHigh: 2700M
memoryMax: 3200M
dbMaxConns: 20
dbVisibilityMaxConns: 5

dynamicConfig:
  history.cacheSizeBasedLimit:
    - value: true
      constraints: {}
  history.hostLevelCacheMaxSizeBytes:
    - value: 268435456
      constraints: {}
  history.enableHostLevelEventsCache:
    - value: true
      constraints: {}
  history.eventsHostLevelCacheMaxSizeBytes:
    - value: 134217728
      constraints: {}
