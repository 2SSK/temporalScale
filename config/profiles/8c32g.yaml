cores: 8
memoryGB: 32
maxShardsPerHost: 8192
goMaxProcs: 8
goMemLimit: 18000MiB
memoryHigh: 27000M
memoryMax: 29000M
dbMaxConns: 80
dbVisibilityMaxConns: 10

dynamicConfig:
  history.cacheSizeBasedLimit:
    - value: true
      constraints: {}
  history.hostLevelCacheMaxSizeBytes:
    - value: 4294967296
      constraints: {}
  history.enableHostLevelEventsCache:
    - value: true
      constraints: {}
  history.eventsHostLevelCacheMaxSizeBytes:
    - value: 2147483648
      constraints: {}
