# compose.yaml - Temporal Web UI (docker, host network) on the server that runs the frontend.
services:
    temporal-ui:
        container_name: temporal-ui
        image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.54.1}
        restart: unless-stopped
        network_mode: ${UI_NETWORK_MODE:-host}
        environment:
            - TEMPORAL_ADDRESS=${TEMPORAL_UI_TARGET:-127.0.0.1:7233}
            - TEMPORAL_CORS_ORIGINS=${TEMPORAL_CORS_ORIGINS:-http://localhost:8080}
            - TEMPORAL_UI_PORT=${UI_PORT:-8080}
            - TEMPORAL_LOG_LEVEL=${LOG_LEVEL:-info}
        mem_limit: ${UI_MEM_LIMIT:-512m}
        mem_reservation: ${UI_MEM_RESERVATION:-128m}
        cpus: ${UI_CPUS:-1.0}
        logging:
            driver: "local"
            options:
                max-size: "${UI_LOG_MAX_SIZE:-50m}"
                max-file: "${UI_LOG_MAX_FILE:-3}"
