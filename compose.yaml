# PostgreSQL for the lab: on VPSLAB's network, started after make up in lab/.
# docker compose --env-file environments/lab/secrets.env up -d --wait
name: temporalScale-lab
services:
  vps-pg:
    image: postgres:17.11
    container_name: vps-pg
    hostname: vps-pg
    restart: unless-stopped
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TOPS_PG_PASSWORD:?set it in environments/lab/secrets.env}
    networks:
      vpslab:
        ipv4_address: 10.80.0.20
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  data:
networks:
  vpslab:
    external: true
