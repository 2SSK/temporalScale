# lab/compose.yaml - Two fresh Ubuntu VPSes and a Postgres box on one private network.
x-vps: &vps
    image: tlab-vps
    build: .
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock]
    restart: unless-stopped
    stop_grace_period: 120s
    networks: [tlab]

name: tlab

services:
    tlab-01:
        <<: *vps
        container_name: tlab-01
        hostname: tlab-01
        networks:
            tlab:
                ipv4_address: 10.77.0.11
        volumes:
            - ./keys:/keys:ro
            - tlab-01-ssh:/etc/ssh/hostkeys
            - tlab-01-opt:/opt
            - tlab-01-etc-temporal:/etc/temporal
            - tlab-01-var-lib-temporal:/var/lib/temporal
            - tlab-01-home:/home/deploy

    tlab-02:
        <<: *vps
        container_name: tlab-02
        hostname: tlab-02
        networks:
            tlab:
                ipv4_address: 10.77.0.12
        volumes:
            - ./keys:/keys:ro
            - tlab-02-ssh:/etc/ssh/hostkeys
            - tlab-02-opt:/opt
            - tlab-02-etc-temporal:/etc/temporal
            - tlab-02-var-lib-temporal:/var/lib/temporal
            - tlab-02-home:/home/deploy

    tlab-pg:
        image: postgres:17.11
        container_name: tlab-pg
        hostname: tlab-pg
        command: postgres -c max_connections=300
        restart: unless-stopped
        environment:
            POSTGRES_USER: temporal
            POSTGRES_PASSWORD: tlabtemporal
        networks:
            tlab:
                ipv4_address: 10.77.0.20
        volumes:
            - tlab-pg-data:/var/lib/postgresql/data

volumes:
    tlab-01-ssh:
    tlab-01-opt:
    tlab-01-etc-temporal:
    tlab-01-var-lib-temporal:
    tlab-01-home:
    tlab-02-ssh:
    tlab-02-opt:
    tlab-02-etc-temporal:
    tlab-02-var-lib-temporal:
    tlab-02-home:
    tlab-pg-data:

networks:
    tlab:
        name: tlab
        ipam:
            config:
                - subnet: 10.77.0.0/24
