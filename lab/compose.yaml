# lab/compose.yaml - Two fresh Ubuntu VPSes and a Postgres box on one private network.
x-vps: &vps
    image: tscale-vps
    build: .
    privileged: true
    cgroup: host
    tmpfs: [/run, /run/lock]
    restart: unless-stopped
    stop_grace_period: 120s
    networks: [tscale]

name: tscale

services:
    tscale-01:
        <<: *vps
        container_name: tscale-01
        hostname: tscale-01
        networks:
            tscale:
                ipv4_address: 10.78.0.11
        volumes:
            - ./keys:/keys:ro
            - tscale-01-ssh:/etc/ssh/hostkeys
            - tscale-01-opt:/opt
            - tscale-01-etc-temporal:/etc/temporal
            - tscale-01-var-lib-temporal:/var/lib/temporal
            - tscale-01-home:/home/deploy

    tscale-02:
        <<: *vps
        container_name: tscale-02
        hostname: tscale-02
        networks:
            tscale:
                ipv4_address: 10.78.0.12
        volumes:
            - ./keys:/keys:ro
            - tscale-02-ssh:/etc/ssh/hostkeys
            - tscale-02-opt:/opt
            - tscale-02-etc-temporal:/etc/temporal
            - tscale-02-var-lib-temporal:/var/lib/temporal
            - tscale-02-home:/home/deploy

    tscale-pg:
        image: postgres:17.11
        container_name: tscale-pg
        hostname: tscale-pg
        command: postgres -c max_connections=300
        restart: unless-stopped
        environment:
            POSTGRES_USER: temporal
            POSTGRES_PASSWORD: tscaletemporal
        networks:
            tscale:
                ipv4_address: 10.78.0.20
        volumes:
            - tscale-pg-data:/var/lib/postgresql/data

volumes:
    tscale-01-ssh:
    tscale-01-opt:
    tscale-01-etc-temporal:
    tscale-01-var-lib-temporal:
    tscale-01-home:
    tscale-02-ssh:
    tscale-02-opt:
    tscale-02-etc-temporal:
    tscale-02-var-lib-temporal:
    tscale-02-home:
    tscale-pg-data:

networks:
    tscale:
        name: tscale
        ipam:
            config:
                - subnet: 10.78.0.0/24
