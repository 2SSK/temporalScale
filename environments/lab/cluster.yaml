# VPSLAB (tops/lab): one cluster at a time, shared with tops' e2e suite.
cluster: tscale-lab
temporal:
  version: 1.31.3
  cli: 1.9.1
  logLevel: info
shards: 512
persistence:
  postgres:
    host: 10.80.0.20
    port: 5432
    user: temporal
    tls: false
ssh:
  user: deploy
  key: ../../lab/keys/id_ed25519
  knownHosts: ../../lab/keys/known_hosts
access:
  clients: [10.80.0.1]
  monitors: [10.80.0.1]
  admins: [10.80.0.1]
  healthchecks: []
namespaces:
  - { name: defaults, retention: 72h }
  - { name: drills, retention: 24h }
nodes:
  - name: vps-01
    address: 10.80.0.11
    roles: [frontend, history, matching, worker]
  - name: vps-02
    address: 10.80.0.12
    roles: [frontend, history, matching, worker]
  - name: vps-03
    address: 10.80.0.13
    roles: [frontend, matching]
